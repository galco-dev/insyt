name: railway-status
# Read-only Railway diagnostic. Triggered by pushing diagnostics/request.txt
# (or manually). Writes the result to diagnostics/railway-status.txt and
# commits it back, so the outcome is readable via the repo itself.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['diagnostics/request.txt']

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Status + logs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          mkdir -p diagnostics
          node scripts/railway/status.js > diagnostics/railway-status.txt 2>&1 || true
          tail -20 diagnostics/railway-status.txt
      - name: Commit result
        run: |
          git config user.name 'railway-status-bot'
          git config user.email 'noreply@tryinsyt.com'
          git add diagnostics/railway-status.txt
          git commit -m 'diagnostics: railway status [skip ci]' || echo 'no change'
          git pull --rebase origin main || true
          git push
