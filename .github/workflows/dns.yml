name: dns
# Idempotent Cloudflare DNS for tryinsyt.com (Resend §17 records + optional
# app CNAME). Needs the CLOUDFLARE_API_TOKEN repo secret (zone-scoped,
# Edit zone DNS on tryinsyt.com only). Output mirrors to the run summary.
on:
  workflow_dispatch:
    inputs:
      railway_web_domain:
        description: "Optional: Railway web domain to CNAME app.tryinsyt.com to (e.g. web-production-xxxx.up.railway.app)"
        required: false
        default: ""

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAILWAY_WEB_DOMAIN: ${{ inputs.railway_web_domain }}
        run: |
          echo '## DNS' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          set -o pipefail
          node scripts/cloudflare/dns.js 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          rc=$?
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $rc
