name: railway
# Provision + deploy the four Insyt services (deploy/README.md).
# Triggers: manual, or pushing diagnostics/deploy-request.txt (lets Claude
# trigger deploys via a file commit). Needs the RAILWAY_TOKEN repo secret.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy code to the services (railway up)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['diagnostics/deploy-request.txt']

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision project, services, redis, variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          echo '## Provision' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          set -o pipefail
          node scripts/railway/provision.js 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          rc=$?
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $rc

  deploy:
    needs: provision
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, worker, poller, cron]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy ${{ matrix.service }}
        env:
          # Account/workspace tokens must be RAILWAY_API_TOKEN for the CLI;
          # RAILWAY_TOKEN is only for project-scoped tokens.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_ID=$(node -e "
            fetch('https://backboard.railway.com/graphql/v2', {
              method: 'POST',
              headers: { authorization: 'Bearer ' + process.env.RAILWAY_API_TOKEN, 'content-type': 'application/json' },
              body: JSON.stringify({ query: 'query { projects { edges { node { id name } } } }' }),
            }).then(r => r.json()).then(b => {
              const edges = (b.data && b.data.projects && b.data.projects.edges) || [];
              const p = edges.map(e => e.node).find(p => p.name === 'insyt');
              if (!p) { console.error('project insyt not found: ' + JSON.stringify(b).slice(0,300)); process.exit(1); }
              console.log(p.id);
            });
          ")
          echo "project: $PROJECT_ID"
          railway link --project "$PROJECT_ID" --environment production --service ${{ matrix.service }}
          railway up --service ${{ matrix.service }} --detach
