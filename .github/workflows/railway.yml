name: railway
# Provision + deploy the four Insyt services (deploy/README.md).
# Triggers: manual, or pushing diagnostics/deploy-request.txt. The deploy job
# writes the full CLI transcript to diagnostics/deploy-log.txt and commits it
# back so the outcome is readable via the repo.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy code to the services (railway up)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['diagnostics/deploy-request.txt']

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision project, services, redis, variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          set -o pipefail
          node scripts/railway/provision.js 2>&1 | tee provision-out.txt
      - name: Keep provision output for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: provision-out
          path: provision-out.txt

  deploy:
    needs: provision
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy all services (sequential, transcripted)
        env:
          # Account/workspace tokens must be RAILWAY_API_TOKEN for the CLI.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "deploy transcript $(date -u +%FT%TZ)"
            railway --version || true
            PROJECT_ID=$(node -e "
              fetch('https://backboard.railway.com/graphql/v2', {
                method: 'POST',
                headers: { authorization: 'Bearer ' + process.env.RAILWAY_API_TOKEN, 'content-type': 'application/json' },
                body: JSON.stringify({ query: 'query { projects { edges { node { id name } } } }' }),
              }).then(r => r.json()).then(b => {
                const p = ((b.data||{}).projects||{edges:[]}).edges.map(e => e.node).find(p => p.name === 'insyt');
                if (!p) { console.error('project insyt not found'); process.exit(1); }
                console.log(p.id);
              });
            ")
            echo "project: $PROJECT_ID"
            for SVC in web worker poller cron; do
              echo; echo "===== $SVC ====="
              railway link --project "$PROJECT_ID" --environment production --service "$SVC" 2>&1 || echo "LINK FAILED rc=$?"
              railway status 2>&1 || true
              railway up --service "$SVC" --detach --verbose 2>&1 || echo "UP FAILED rc=$?"
            done
          } | tee diagnostics/deploy-log.txt
      - name: Commit transcript
        if: always()
        run: |
          git config user.name 'railway-deploy-bot'
          git config user.email 'noreply@tryinsyt.com'
          git add diagnostics/deploy-log.txt
          git commit -m 'diagnostics: deploy transcript [skip ci]' || echo 'no change'
          git pull --rebase origin main || true
          git push
