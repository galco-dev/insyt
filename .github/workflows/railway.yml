name: railway
# Provision + deploy the four Insyt services (deploy/README.md).
# Triggers: manual, or pushing diagnostics/deploy-request.txt. The deploy job
# writes the full CLI transcript to diagnostics/deploy-log.txt and commits it
# back so the outcome is readable via the repo.
#
# Tokens: RAILWAY_TOKEN (workspace token) drives the GraphQL provisioning.
# RAILWAY_PROJECT_TOKEN (project token, production environment) drives the CLI
# deploys — workspace tokens are API-only and the CLI rejects them.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also deploy code to the services (railway up)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['diagnostics/deploy-request.txt']

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision project, services, redis, variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          set -o pipefail
          node scripts/railway/provision.js 2>&1 | tee provision-out.txt

  deploy:
    needs: provision
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy all services (sequential, transcripted)
        env:
          # Project token: CLI-native, pre-scoped to project+environment,
          # no link step needed.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "deploy transcript $(date -u +%FT%TZ)"
            railway --version || true
            if [ -z "$RAILWAY_TOKEN" ]; then
              echo "RAILWAY_PROJECT_TOKEN secret is missing — create a project token (insyt → Settings → Tokens, production environment) and add it."
              exit 1
            fi
            railway status 2>&1 || true
            for SVC in web worker poller cron; do
              echo; echo "===== $SVC ====="
              railway up --service "$SVC" --detach 2>&1 || echo "UP FAILED rc=$?"
            done
          } | tee diagnostics/deploy-log.txt
      - name: Commit transcript
        if: always()
        run: |
          git config user.name 'railway-deploy-bot'
          git config user.email 'noreply@tryinsyt.com'
          git add diagnostics/deploy-log.txt
          git commit -m 'diagnostics: deploy transcript [skip ci]' || echo 'no change'
          git pull --rebase origin main || true
          git push
